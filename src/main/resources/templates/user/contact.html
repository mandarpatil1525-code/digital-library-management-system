<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Contact')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container" style="max-width:640px">
  <h1>Contact the Librarian</h1>
  <div th:replace="~{fragments :: flash}"></div>
  <div class="card">
    <form th:action="@{/user/contact}" method="post">
      <label>Subject</label><input name="subject" maxlength="120" required>
      <label>Message</label><textarea name="message" rows="6" maxlength="2000" required></textarea>
      <p><button type="submit">Send</button></p>
    </form>
  </div>
</div>
</body>
</html>
