<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Catalogue')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container">
  <h1>Book Catalogue</h1>
  <div th:replace="~{fragments :: flash}"></div>
  <form class="search" method="get" th:action="@{/user/catalog}">
    <input name="q" th:value="${q}" placeholder="Search by title or author">
    <select name="category">
      <option value="">All categories</option>
      <option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${c == category}"></option>
    </select>
    <button type="submit">Search</button>
    <a class="btn sec" th:href="@{/user/catalog}">Reset</a>
  </form>
  <div class="table-wrap">
  <table>
    <thead><tr><th>Title</th><th>Author</th><th>Category</th><th>ISBN</th><th>Available</th><th></th></tr></thead>
    <tbody>
      <tr th:each="b : ${books}">
        <td th:text="${b.title}"></td>
        <td th:text="${b.author}"></td>
        <td><span class="badge b-gray" th:text="${b.category}"></span></td>
        <td th:text="${b.isbn}"></td>
        <td>
          <span th:if="${b.available > 0}" class="badge b-ok" th:text="${b.available} + ' / ' + ${b.quantity}"></span>
          <span th:if="${b.available == 0}" class="badge b-err">Issued out</span>
        </td>
        <td>
          <form class="inline" th:if="${b.available > 0}" th:action="@{/user/issue/{id}(id=${b.id})}" method="post">
            <button type="submit">Issue</button></form>
          <form class="inline" th:if="${b.available == 0}" th:action="@{/user/reserve/{id}(id=${b.id})}" method="post">
            <button class="amber" type="submit">Reserve</button></form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(books)}"><td colspan="6" class="muted">No books found.</td></tr>
    </tbody>
  </table>
  </div>
  <p class="muted">Loan period: 14 days · Max 3 books at a time · Late fine: ₹5 per day</p>
</div>
</body>
</html>
