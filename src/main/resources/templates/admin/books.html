<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Manage Books')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container">
  <h1>Manage Books</h1>
  <div th:replace="~{fragments :: flash}"></div>
  <form class="search" method="get" th:action="@{/admin/books}">
    <input name="q" th:value="${q}" placeholder="Search title or author">
    <button type="submit">Search</button>
    <a class="btn" th:href="@{/admin/books/new}">+ Add Book</a>
  </form>
  <div class="table-wrap">
  <table>
    <thead><tr><th>ID</th><th>Title</th><th>Author</th><th>ISBN</th><th>Category</th><th>Qty</th><th>Available</th><th></th></tr></thead>
    <tbody>
      <tr th:each="b : ${books}">
        <td th:text="${b.id}"></td><td th:text="${b.title}"></td><td th:text="${b.author}"></td>
        <td th:text="${b.isbn}"></td><td th:text="${b.category}"></td>
        <td th:text="${b.quantity}"></td><td th:text="${b.available}"></td>
        <td class="actions">
          <a class="btn sec" th:href="@{/admin/books/edit/{id}(id=${b.id})}">Edit</a>
          <form class="inline" th:action="@{/admin/books/delete/{id}(id=${b.id})}" method="post"
                onsubmit="return confirm('Delete this book?')">
            <button class="danger" type="submit">Delete</button></form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(books)}"><td colspan="8" class="muted">No books.</td></tr>
    </tbody>
  </table>
  </div>
</div>
</body>
</html>
