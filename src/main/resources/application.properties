server.port=8080
spring.application.name=digital-library

# ---- Default DB: H2 file database (zero setup, data kept in ./data) ----
spring.datasource.url=jdbc:h2:file:./data/librarydb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- To use MySQL instead: comment the H2 lines above and uncomment these ----
# spring.datasource.url=jdbc:mysql://localhost:3306/librarydb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=your_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
